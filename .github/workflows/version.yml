name: Compute Version

on:
  workflow_call:
    outputs:
      previousTag:
        description: "Previous Git tag"
        value: ${{ jobs.version.outputs.previousTag }}

      nextTag:
        description: "Next semantic version tag"
        value: ${{ jobs.version.outputs.nextTag }}

      bumpType:
        description: "Version bump type: major, minor or patch"
        value: ${{ jobs.version.outputs.bumpType }}

jobs:
  version:
    name: Compute Version
    runs-on: ubuntu-latest

    outputs:
      previousTag: ${{ steps.version.outputs.previousTag }}
      nextTag: ${{ steps.version.outputs.nextTag }}
      bumpType: ${{ steps.version.outputs.bumpType }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        shell: bash
        run: |
          # --------------------------------
          # Find previous tag
          # --------------------------------

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")

          echo "Previous tag: $PREVIOUS_TAG"

          # Remove the "v"
          VERSION="${PREVIOUS_TAG#v}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # --------------------------------
          # Get commits since previous tag
          # --------------------------------

          if [ "$PREVIOUS_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --format="%B")
          else
            COMMITS=$(git log "${PREVIOUS_TAG}..HEAD" --format="%B")
          fi

          echo "Commits:"
          echo "$COMMITS"

          # --------------------------------
          # Determine bump type
          # --------------------------------

          BUMP_TYPE="patch"

          # BREAKING CHANGE has priority
          if echo "$COMMITS" | grep -Eiq \
            'BREAKING CHANGE|^[a-zA-Z]+(\([^)]+\))?!:'; then

            BUMP_TYPE="major"

          elif echo "$COMMITS" | grep -Eiq \
            '^feat(\([^)]+\))?:'; then

            BUMP_TYPE="minor"

          fi

          echo "Bump type: $BUMP_TYPE"

          # --------------------------------
          # Compute next version
          # --------------------------------

          case "$BUMP_TYPE" in

            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;

            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;

            patch)
              PATCH=$((PATCH + 1))
              ;;

          esac

          NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"

          echo "Next tag: $NEXT_TAG"

          # --------------------------------
          # Outputs
          # --------------------------------

          echo "previousTag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "nextTag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "bumpType=$BUMP_TYPE" >> "$GITHUB_OUTPUT"

      - name: Version summary
        shell: bash
        run: |
          echo "### Version" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | Version |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Previous | \`${{ steps.version.outputs.previousTag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Next | \`${{ steps.version.outputs.nextTag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bump | \`${{ steps.version.outputs.bumpType }}\` |" >> "$GITHUB_STEP_SUMMARY"