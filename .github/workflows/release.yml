name: Create Release

on:
  workflow_call:
    inputs:
      artifactName:
        description: "Name of the build artifact"
        required: false
        type: string
        default: ""

      releaseName:
        description: "Custom release name. Defaults to generated tag."
        required: false
        type: string
        default: ""

      prerelease:
        description: "Mark release as prerelease"
        required: false
        type: boolean
        default: false

      nextTag:
        description: "Tag used for the new release"
        required: true
        type: string

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------
      # Devlog
      # ------------------------------

      - name: Download devlog
        uses: actions/download-artifact@v4
        with:
          name: release-devlog
          path: release-notes

      # ------------------------------
      # Build
      # ------------------------------

      - name: Download build artifact
        if: inputs.artifactName != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifactName }}
          path: release-artifacts

      # ------------------------------
      # Tag
      # ------------------------------

      - name: Create tag
        env:
          NEW_TAG: ${{ inputs.nextTag }}
        shell: bash
        run: |
          echo "Creating tag: $NEW_TAG"

          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      # ------------------------------
      # Release
      # ------------------------------

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ inputs.releaseName }}
          NEW_TAG: ${{ inputs.nextTag }}
        shell: bash
        run: |
          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="$NEW_TAG"
          fi

          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE=""
          fi

          if [ -d "release-artifacts" ] && [ "$(ls -A release-artifacts)" ]; then

            gh release create "$NEW_TAG" \
              release-artifacts/* \
              --title "$RELEASE_NAME" \
              --notes-file release-notes/release-notes.md \
              $PRERELEASE

          else

            gh release create "$NEW_TAG" \
              --title "$RELEASE_NAME" \
              --notes-file release-notes/release-notes.md \
              $PRERELEASE

          fi