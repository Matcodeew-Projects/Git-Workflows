name: Generate Devlog

on:
  workflow_call:
    inputs:
      outputFile:
        description: "Generated devlog file"
        required: false
        type: string
        default: "release-notes.md"

      previousTag:
        description: "Previous release tag"
        required: true
        type: string

      nextTag:
        description: "Next release tag"
        required: true
        type: string

jobs:
  devlog:
    name: Generate Devlog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------
      # Devlog
      # ------------------------------

      - name: Generate devlog
        shell: bash
        env:
          PREVIOUS_TAG: ${{ inputs.previousTag }}
          NEXT_TAG: ${{ inputs.nextTag }}
          OUTPUT: ${{ inputs.outputFile }}
        run: |
          git fetch --tags

          echo "Previous tag: $PREVIOUS_TAG"
          echo "Next tag: $NEXT_TAG"

          # If no real release exists yet, use all commits.
          if [ "$PREVIOUS_TAG" = "v0.0.0" ] && ! git rev-parse "$PREVIOUS_TAG" >/dev/null 2>&1; then
            RANGE="HEAD"
          else
            RANGE="${PREVIOUS_TAG}..HEAD"
          fi

          echo "Commit range: $RANGE"

          echo "# ${NEXT_TAG}" > "$OUTPUT"
          echo "" >> "$OUTPUT"

          add_section () {
            TITLE="$1"
            PATTERN="$2"

            COMMITS=$(git log "$RANGE" \
              --pretty=format:"%s" \
              --extended-regexp \
              --grep="$PATTERN" || true)

            if [ -n "$COMMITS" ]; then
              echo "## $TITLE" >> "$OUTPUT"
              echo "" >> "$OUTPUT"

              echo "$COMMITS" | sed 's/^/- /' >> "$OUTPUT"

              echo "" >> "$OUTPUT"
            fi
          }

          add_section "Features" "^feat(\(.+\))?!?:"
          add_section "Fixes" "^fix(\(.+\))?!?:"
          add_section "Performance" "^perf(\(.+\))?!?:"
          add_section "Refactoring" "^refactor(\(.+\))?!?:"
          add_section "Documentation" "^docs(\(.+\))?!?:"
          add_section "Tests" "^test(\(.+\))?!?:"
          add_section "CI / CD" "^ci(\(.+\))?!?:"

      # ------------------------------
      # Artifact
      # ------------------------------

      - name: Upload devlog
        uses: actions/upload-artifact@v4
        with:
          name: release-devlog
          path: ${{ inputs.outputFile }}
          retention-days: 30